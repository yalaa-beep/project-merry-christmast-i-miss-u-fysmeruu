<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merry Christmas I Miss You</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #0B0C16;
        font-family: Helvetica, Arial, sans-serif;
    }

    #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000000;
    }

    #lyrics {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        text-align: center;

        color: white;
        font-size: 20px;
        font-weight: bold;

        text-shadow:
            0 0 5px white,
            0 0 15px rgba(255,255,255,0.5);

        z-index: 2;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="lyrics"></div>

<script>

// ==============================
// LYRICS
// ==============================

const lyrics = [
    ["You know it's true", 0.07, 2.3],
    ["Yeah i miss you", 0.08, 3.2],
    ["You know it's true", 0.09, 3.1],
    ["So, What if i call?", 0.06, 2.7],
    ["And you pick up the phone", 0.06, 2.9],
    ["And i use this holiday", 0.06, 1.8],
    ["To make my way to your ghost", 0.08, 3.4],
    ["Oh, what if you're lonely?", 0.07, 2.9],
    ["You know i am too", 0.06, 2.8],
    ["And i get the chance to say", 0.05, 2.4],
    ["Merry Christmas i miss you", 0.08, 3.8],
    ["I MISS YOU", 0.09, 1.4]
];


// ==============================
// CANVAS
// ==============================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// ==============================
// PARTICLES
// ==============================

const particles = [];

const raindropColors = [
    "#87CEFA",
    "#4682B4",
    "#B0C4DE"
];

const sparkleColors = [
    "#304379",
    "#6D68A1",
    "#3E6579"
];

const twinkleColors = [
    "#7571B8",
    "#4F448B",
    "#FFF8DC"
];

const kinds = [
    "raindrop",
    "snow",
    "sparkle",
    "butterfly"
];

function random(min, max) {
    return Math.random() * (max - min) + min;
}


// ==============================
// CREATE 150 PARTICLES
// ==============================

function createParticles(num = 150) {

    for (let i = 0; i < num; i++) {

        const kind =
            kinds[Math.floor(Math.random() * kinds.length)];

        const particle = {
            x: random(0, canvas.width),
            y: random(0, canvas.height),
            size: random(2, 6),
            kind: kind,
            speed: kind === "raindrop" ? 3 : 1,
            color: "#FFFFFF"
        };

        if (kind === "raindrop") {

            particle.length = random(8, 15);

            particle.color =
                raindropColors[
                    Math.floor(Math.random() * raindropColors.length)
                ];

        }

        else if (kind === "snow") {

            particle.symbol = "❆";

            particle.color =
                ["#FFF8DC", "#F0FFFF", "#D3D3D3"][
                    Math.floor(Math.random() * 3)
                ];

        }

        else if (kind === "sparkle") {

            particle.symbol = "✦";

            particle.color =
                sparkleColors[
                    Math.floor(Math.random() * sparkleColors.length)
                ];

        }

        else if (kind === "butterfly") {

            particle.symbol = "🦋";

            particle.color =
                ["#7571B8", "#4F448B", "#FFF8DC"][
                    Math.floor(Math.random() * 3)
                ];
        }

        particles.push(particle);
    }
}


// ==============================
// DRAW PARTICLES
// ==============================

function drawParticles() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (const p of particles) {

        ctx.fillStyle = p.color;

        if (p.kind === "raindrop") {

            ctx.beginPath();

            ctx.moveTo(p.x, p.y);
            ctx.lineTo(
                p.x,
                p.y + p.length
            );

            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        else {

            ctx.font =
                `${p.size + (p.kind === "butterfly" ? 4 : 0)}px Helvetica`;

            ctx.fillText(
                p.symbol,
                p.x,
                p.y
            );
        }

        // Movement

        p.y += p.speed;

        // Reset when reaching bottom

        if (p.y > canvas.height) {

            p.x = random(0, canvas.width);
            p.y = 0;
        }
    }

    requestAnimationFrame(drawParticles);
}


// ==============================
// TWINKLE EFFECT
// ==============================

setInterval(() => {

    for (const p of particles) {

        if (
            p.kind === "snow" ||
            p.kind === "sparkle"
        ) {

            p.color =
                twinkleColors[
                    Math.floor(
                        Math.random() *
                        twinkleColors.length
                    )
                ];
        }
    }

}, 500);


// ==============================
// TYPEWRITER LYRICS
// ==============================

const lyricElement =
    document.getElementById("lyrics");


function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


async function typewriterEffect() {

    for (const [line, charDelay, lineDelay] of lyrics) {

        let text = "";

        for (const char of line) {

            text += char;

            lyricElement.textContent = text;

            await sleep(
                charDelay * 1000
            );
        }

        await sleep(
            lineDelay * 1000
        );

        lyricElement.textContent = "";
    }
}


// ==============================
// START
// ==============================

createParticles(150);

drawParticles();

setTimeout(() => {

    typewriterEffect();

}, 500);

</script>

</body>
</html>
